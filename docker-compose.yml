services:
  postgres:
    image: postgres:16-alpine
    container_name: localthreads_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: localthreads
      POSTGRES_PASSWORD: localthreads_dev
      POSTGRES_DB: localthreads
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
